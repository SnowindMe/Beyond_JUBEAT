<!doctype html><html lang="zh-CN" data-g="yymf"><head><meta charset="utf-8">
<title>验收</title><link rel="stylesheet" href="./songs-live.css">
<style>

.host{width:1240px;max-width:100%;padding:24px;box-sizing:border-box}
.two{display:grid;grid-template-columns:208px 1fr;gap:26px 58px}
.left{background:#dde4f5;border-radius:8px}

.sd-gauge{margin-left:0;width:100%}
</style></head><body>
<div class="host"><div class="two"><div class="left" style="height:208px"></div>
<div class="main"><div class="sd-gauge" id="g"></div></div></div></div>
<script>
var C={"bsc":[0,4,0,0,0,2,1,0,2,3,2,0,1,2,3,1,0,2,3,2,2,0,1,4,3,4,3,4,4,3,4,5,1,3,2,2,4,3,3,3,1,4,1,4,4,3,4,4,3,4,3,4,4,3,4,4,3,4,4,2,5,6,4,4,7,4,5,7,2,0,4,4,3,4,3,4,4,4,2,4,3,4,4,7,8,5,5,6,6,5,6,8,5,3,4,5,5,8,6,4,6,6,5,8,6,6,2,6,4,6,8,5,3,8,8],"adv":[0,8,0,5,5,2,3,4,4,3,2,4,5,2,3,4,3,4,4,8,8,0,2,8,6,8,6,9,11,11,11,11,5,4,5,7,7,6,6,6,5,5,4,6,8,6,7,6,5,7,6,8,7,6,7,8,6,8,6,2,8,9,4,6,10,4,4,14,4,0,8,8,6,8,8,11,11,9,3,7,8,7,6,8,11,6,7,8,6,8,8,8,8,6,8,8,6,11,5,8,8,6,8,8,9,8,8,9,9,12,12,5,14,11,4],"ext":[0,8,0,7,6,4,4,5,7,6,4,6,8,4,6,6,5,7,6,11,10,5,6,10,10,12,11,15,14,13,11,12,6,7,6,8,9,9,11,11,9,10,8,12,12,9,9,10,10,9,8,11,8,10,10,10,8,11,9,8,11,10,7,10,14,6,6,14,1,15,11,11,12,10,15,15,11,10,6,8,9,8,8,10,13,8,9,8,10,9,8,14,8,6,8,10,8,12,7,7,9,5,13,11,12,11,10,11,11,12,11,12,14,8,10]};
var LV={bsc:{lv:5,n:427,p:83,h:30,hp:7.0},adv:{lv:9.3,n:757,p:65,h:19,hp:2.5},ext:{lv:10.7,n:1040,p:94,h:40,hp:3.8}};
var LAB={bsc:'BSC',adv:'ADV',ext:'EXT'},MAX=11,MAXL=8,MED=6.04,HS=20,SMAX=11;
var h='<div class="sd-scale"><b><span style="left:'+(5/SMAX*100)+'%">5</span>';
h+='<span style="left:'+(10/SMAX*100)+'%">10</span></b></div>';
['bsc','adv','ext'].forEach(function(k){
  var d=LV[k],cols=C[k];
  var fill=Math.max(4,Math.round(d.lv/MAX*100));
  var pips='';for(var i=1;i<=10;i++)pips+='<b class="'+(i<=Math.round(d.p/10)?'is-on':'')+'"></b>';
  var cells=cols.map(function(v){
    var n=Math.min(MAXL,v),s='';
    for(var j=0;j<n;j++)s+='<b></b>';
    return '<span class="sd-col" style="--n:'+n+'">'+s+'</span>';
  }).join('');
  h+='<div class="sd-lrow sd-lrow-'+k+'">'
   +'<span class="sd-lrow-k">'+LAB[k]+'</span>'
   +'<span class="sd-lrow-track"><span class="sd-lrow-fill" style="width:'+fill+'%"></span></span>'
   +'<span class="sd-lrow-v">'+d.lv+'</span>'
   +'<span class="sd-lrow-sub"><span class="sd-facts">'
   +'<span class="sd-fact"><em>'+d.n+'</em>键</span>'
   +'<span class="sd-pctl">'+pips+'</span><span class="sd-pctl-v">P'+d.p+'</span>'
   +'<span class="sd-holdwrap"><span class="sd-fact"><em>'+d.h+'</em>长押</span>'
   +'<span class="sd-holdbar" style="--w:'+(d.hp/HS*100)+'%;--med:'+(MED/HS*100)+'%"><u></u><i></i></span>'
   +'<span class="sd-pctl-v">'+d.hp.toFixed(1)+'%</span></span></span></span>'
   +'<span class="sd-chart">'+cells+'</span></div>';
});
document.getElementById('g').innerHTML=h;
</script></body></html>
