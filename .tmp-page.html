      // 【2026-10-29 主人「有些浏览器没加载完 bgm 资源，loading 就提前消失了」】
      // 根因：'playing' 在某些浏览器里会**早于缓冲完成**触发（尤其 Safari / 弱网），
      // 此时只是"开始尝试出声"，data 可能还不够，之后还会卡顿重缓冲。
      // 判据改为看 readyState：HAVE_FUTURE_DATA(3) 以上才算真的能连续播放。
      // 我们不在 playing 里清 loading，而是统一走 canplay/canplaythrough +
      // 一个 readyState 复查，两个条件都满足才撤掉转圈。
      function clearLoadingIfReady() {
        if (!audio) return;
        // 3 = HAVE_FUTURE_DATA（有当前帧 + 后续数据），比 2（HAVE_CURRENT_DATA）更稳
        if (audio.readyState >= 3) {
          root.classList.remove('is-loading');
        }
      }
      audio.addEventListener('canplay', clearLoadingIfReady);
      audio.addEventListener('canplaythrough', clearLoadingIfReady);
      // 兜底轮询：canplay/canplaythrough 在个别浏览器里可能提前或延迟触发，
      // 每 200ms 复查 readyState，达标就撤转圈。
      var readyTimer = setInterval(clearLoadingIfReady, 200);
      // 【防卡死】readyState 一直到不了 3（网络卡住/上游慢）时，转圈不能无限转下去——
      // 那会让用户以为"还在加载"，实际上什么都没发生。
      // 15s 后无论 readyState 如何都撤掉转圈；若仍未就绪，按钮保持可点（再点会重新拉流）。
      var loadGuard = setTimeout(function () {
        root.classList.remove('is-loading');
      }, 15000);
      audio.addEventListener('error', function () {
        clearInterval(readyTimer);
        clearTimeout(loadGuard);
      });
      audio.addEventListener('loadedmetadata', function () {
        root.classList.add('is-ready');
        paint();
      });
      audio.addEventListener('timeupdate', function () {
        if (!dragging) paint();
      });
      // 【2026-10-29 主人第 6 条】点下播放后要**先显示转圈，等资源真的能放再切暂停键**。
      // 关键在于听 'playing'（已有足够数据、真正开始输出声音）而不是 'play'
      // （只是"被要求播放"，此时可能还在缓冲）。原实现听 'play' 并顺手去掉 is-loading，
      // 导致慢网下转圈一闪而过、图标立刻变成暂停，像是在播而实际没声音。
      audio.addEventListener('playing', function () {
        root.classList.add('is-playing');
        // 【不再在这里清 is-loading】'playing' 可能早于缓冲完成触发，
        // 由 canplay / canplaythrough / 轮询按 readyState>=3 来撤转圈，见上面。
        clearLoadingIfReady();
        setBgm('playing');
      });
      audio.addEventListener('pause', function () {
        root.classList.remove('is-playing');
        setBgm('');
      });
      audio.addEventListener('ended', function () {
        root.classList.remove('is-playing');
        setBgm('');
        paint();
      });
      audio.addEventListener('error', function () {
        root.classList.add('is-error');
        root.classList.remove('is-playing', 'is-loading', 'is-ready');
        durEl.textContent = '不可用';
        btn.setAttribute('aria-label', '音源不可用');
        btn.disabled = true;
        btn.style.cursor = 'default';
      });
      return audio;
    }

    btn.addEventListener('click', function () {
      var a = ensure();
      if (a.paused) {
        // 先上转圈，再发起播放：顺序反了会出现"资源秒到、转圈来不及显示"的闪烁。
        // 只有 'playing' 事件（真正能出声）才会清掉它，见 ensure() 里的监听。
        root.classList.add('is-loading');
        // 走 play() 的 promise：被浏览器策略拦下时把转圈收回，不留假加载状态
        var p = a.play();
        if (p && p.catch) {
          p.catch(function () {
            root.classList.remove('is-loading', 'is-playing');
          });
        }
      } else {
        a.pause();
        root.classList.remove('is-loading');
      }
      btn.blur();
    });

    function seekFromEvent(e) {
      var a = ensure();
      var r = track.getBoundingClientRect();
      var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      var d = a.duration;
      if (!isFinite(d) || d <= 0) return;
      a.currentTime = p * d;
      paint();
    }

    track.addEventListener('pointerdown', function (e) {
      dragging = true;
      if (track.setPointerCapture) track.setPointerCapture(e.pointerId);
      seekFromEvent(e);
    });
    track.addEventListener('pointermove', function (e) {
      if (dragging) seekFromEvent(e);
    });
    track.addEventListener('pointerup', function (e) {
      dragging = false;
      if (track.releasePointerCapture) {
        try { track.releasePointerCapture(e.pointerId); } catch {}
      }
    });
    // 拖出轨道后松手也要结束拖拽状态，否则进度条会一直跟着鼠标
    track.addEventListener('pointercancel', function () {
      dragging = false;
    });

    // 键盘：左右 ±5 秒，Home/End 跳到首尾。空格交给按钮本身（不在这里抢）。
    track.addEventListener('keydown', function (e) {
      var a = ensure();
      if (!isFinite(a.duration) || a.duration <= 0) return;
      var step = 5;
      if (e.key === 'ArrowLeft') a.currentTime = Math.max(0, a.currentTime - step);
      else if (e.key === 'ArrowRight') a.currentTime = Math.min(a.duration, a.currentTime + step);
      else if (e.key === 'Home') a.currentTime = 0;
      else if (e.key === 'End') a.currentTime = a.duration;
      else return;
      e.preventDefault();
      paint();
    });

    /* 【2026-10-29 主人「移动端播放 bgm 时用手势从详情页退回曲目页，音乐不会停」】
       根因：Audio 对象是 JS 持有的，浏览器**不会**因为"页面被导航走"就自动暂停它——
       尤其在 iOS Safari / 微信里用手势返回时，页面进 bfcache，DOM 还在、Audio 还在播。
       所以必须自己监听页面生命周期：
         · pagehide：页面离开（含进 bfcache、被卸载）→ 立即暂停并复位；
         · visibilitychange：切到后台/切标签 → 也暂停（移动端音频在后台继续放很扰人）；
         · bfcache 恢复（pageshow 的 persisted=true）→ 保持暂停状态，不自动续播，
           用户回来看到的是暂停中的播放器，需要再点一次。
       另外必须清掉 html[data-bgm]，否则唱片在用户返回后仍显示旋转。 */
    function stopAndReset() {
      if (audio && !audio.paused) {
        try { audio.pause(); } catch (e) { /* 已卸载时个别浏览器会抛，忽略 */ }
      }
      root.classList.remove('is-playing', 'is-loading');
      setBgm('');
    }
    window.addEventListener('pagehide', stopAndReset);
    // bfcache 命中（Chromium / Firefox / Safari 都会）——页面没真正销毁时也要复位
    window.addEventListener('beforeunload', stopAndReset);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') stopAndReset();
    });
    // 从 bfcache 返回：确保 UI 与状态都是"暂停"，而不是停在播放态
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) {
        root.classList.remove('is-playing', 'is-loading');
        setBgm('');
        paint();
      }
    });

    paint();
  })();

    function fitTitle() {
      var wrap = document.querySelector('.sd-title-wrap');
      if (!wrap) return;
      var btn = wrap.querySelector('.sd-title');
      if (!btn) return;
      var inner = btn.querySelector('.sd-title-t');

    {k:'saucerfulfill',n:'saucer fulfill',f:'F',c:'#c9d2d6'},
    {k:'prop',n:'prop',f:'E',c:'#e0338f'},
    {k:'qubell',n:'Qubell',f:'D',c:'#3E8FBF'},
    {k:'clan_red',n:'clan Red',f:'C',c:'#ff6b6b'},
    {k:'clan_blue',n:'clan Blue',f:'C',c:'#5c8dff'},
    {k:'clan_green',n:'clan Green',f:'C',c:'#57d98a'},
    {k:'clan_purple',n:'clan Purple',f:'C',c:'#b07dff'},
    {k:'festo',n:'festo',f:'G',c:'#ffd166'},
    {k:'ave',n:'Ave.',f:'F',c:'#2ee8e8'},
    {k:'bta',n:'Beyond the Ave.',f:'F',c:'#ffa23c'},
    {k:'yymf',n:'音乐魔方',f:'F',c:'#8fd0ff'}
  ];
  var BG='/assets/images/bg/';
  /* 背景图版本号（单一来源在 Base.astro 的 JB_BGVER）：图换了但文件名不变，
     而 /assets/images/* 是 immutable 一年缓存，老访客会一直看旧图。
     所以给换过的图拼 ?v=N 破缓存，没换过的图不加参数（不多下 397KB）。 */
  var BGVER=window.JB_BGVER||{};
  // 字标：首屏只加载当前世代那一张，切主题时才换 src（原先 10 张一起下载，浪费 ~150KB）
  var LOGO='/assets/images/logo/';
  var root=document.documentElement, dock=document.getElementById('genDock');
  var wordLogo=document.getElementById('wordLogo');
  var btns={}, cur=null;
  GEN.forEach(function(g){
    var b=document.createElement('button');
    b.type='button'; b.title=g.n;
    b.style.setProperty('--sw',g.c);
    b.innerHTML='<i></i><span>'+g.n+'</span>';
    b.addEventListener('click',function(){apply(g);});
    dock.appendChild(b); btns[g.k]=b;
  });

  /* 主题切换动画：背景交叉淡入。
     body::after 的 background-image 本身不可过渡（浏览器把它当离散值，切图即硬跳），
     所以另起 .bgv 两层背景板：旧图留在 A/B 中当前那张，新图铺到另一张再淡入，
     opacity 走 GPU 合成，切主题时图是「渐变过去」而不是「闪一下」。 */
  var bgv=document.querySelectorAll('.bgv-l'), vf=0;
  function paint(g){
    var url='url("'+bgUrl(g)+'")';
    var nx=bgv[(vf+1)%bgv.length];
    nx.style.backgroundImage=url;
    nx.style.opacity='1';
    bgv[vf].style.opacity='0';
    vf=(vf+1)%bgv.length;
  }
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 切世代要不要「等」，不靠猜：一律走 bootApi.begin(160)。
     160ms 内新背景与新字标就位（缓存命中时就是这样），遮罩根本不会出现；
     真要从网上拉图，160ms 后自动亮起 LOADING，等图铺好再收。 */
  var bootApi = window.jbBoot;

  /* 本页已经真正拿到过的图。有了这张表，「缓存命中」就不用靠 160ms 猜，
     可以直接完全跳过遮罩——本地切换世代零闪烁靠的就是它。 */
  var loaded = {};
  function logoUrl(g){ return LOGO + (g.k.indexOf('clan_')===0 ? 'clan' : g.k) + '.webp'; }
  function bgUrl(g){ return BG + g.k + '.webp' + (BGVER[g.k] ? '?v=' + BGVER[g.k] : ''); }
  function sync(g){ loaded[bgUrl(g)] = 1; loaded[logoUrl(g)] = 1; }

  /* 换世代要下载两样东西：背景大图 + 字标。两样都到齐了才撤遮罩，
     否则会出现「遮罩收了但背景还是空白」的那一下。 */
  function waitImages(g, done) {
    var lu = logoUrl(g), bu = bgUrl(g);
    var left = 2, closed = false;
    function tick(url) {
      if (closed) return;
      loaded[url] = 1;
      left--;
      if (left > 0) return;
      closed = true;
      // 不包 rAF：图已在内存里，commit 时写进 .bgv 的 backgroundImage 与遮罩收起
      // 是同一次样式更新，浏览器同一帧提交，不会露出空白。而 rAF 在窗口失焦/后台
      // 会被节流到 1s 一次，那样遮罩就会多挂一秒——实测踩过这个坑。
      done();
    }
    [bu, lu].forEach(function (url) {
      var img = new Image();
      img.onload = function () { tick(url); };
      img.onerror = function () { tick(url); };
      img.src = url;
    });
    // 兜底：2.6s 还没齐也别把人锁住
    setTimeout(function () {
      if (closed) return;
      closed = true;
      done();
    }, 2600);
  }

  /* theme-color：手机浏览器地址栏/状态栏的颜色。原来写死 #0b1a22，15 套主题里 0 套对。
     现在跟着当前世代的 --base 走：读的是 <html> 上解析后的 --base，
     所以换世代只要在 commit() 里同步一次，不用在 JS 里再维护一份色表。 */
  var metaTheme=document.querySelector('meta[name="theme-color"]');
  function syncThemeColor(){
    if(!metaTheme) return;
    var base=getComputedStyle(root).getPropertyValue('--base').trim();
    if(base) metaTheme.setAttribute('content',base);
  }
  function commit(g,instant){
    var prev=cur; cur=g;
    root.setAttribute('data-g',g.k);
    root.setAttribute('data-font',g.f);
    syncThemeColor();
    if(wordLogo){
      // 四个 clan_* 世代共用同一张 clan 字标
      var next=logoUrl(g);
      if(wordLogo.getAttribute('src')!==next){
        /* 换图：尺寸由 CSS 按世代写死的 aspect-ratio 一次到位（见 theme.css 比例表），
           所以这里只换 src 即可，视觉上是硬切、无缩放抖动。
           不做淡入：淡入要靠 opacity 动画，而动画在后台标签页会冻结在起始帧
           （opacity 0），整张 logo 会直接消失。 */
        wordLogo.setAttribute('src',next);
      }
    }
    // 首屏曲绘立方体跟着换：显示「当前主题世代定数最高的 16 首」（2026-10-25 主人要求）。
    // 由 Hero.astro 暴露的 window.jbCube 负责重绘；它内部把 clan_* 四个主题都映射到 clan 世代。
    // 这里不判断「是否同世代」——clan Red→clan Blue 时曲绘相同，重绘一次代价很小（16 个 img 换 src），
    // 但能保证逻辑只有一条路径，不用再维护一份「上次渲染的是哪个世代」的状态。
    if (window.jbCube) { try { window.jbCube(g.k); } catch (e) {} }
    root.style.removeProperty('--bgimg');
    root.style.removeProperty('--bgop');
    for(var k in btns){btns[k].setAttribute('aria-pressed',k===g.k?'true':'false');}
    if(instant||reduce||!prev){
      // 首屏直接落图，不要从空白淡进来
      for(var i=0;i<bgv.length;i++){bgv[i].style.transition='none';}
      bgv[0].style.backgroundImage=bgv[1].style.backgroundImage='url("'+bgUrl(g)+'")';
      bgv[0].style.opacity='1'; bgv[1].style.opacity='0';
      vf=0;
      // 关键：必须把 transition 还回去，否则首屏这一下会把「永不过渡」写死在元素上，
      // 之后每次切主题都是硬跳（这正是要修的那个闪一下）。
      void bgv[0].offsetWidth;
      for(var j=0;j<bgv.length;j++){bgv[j].style.transition='';}
    }else{
      paint(g);
    }
    try{localStorage.setItem('jubeat-gen',g.k);}catch(e){}
  }

  function apply(g,instant){
    var prev=cur;
    if(instant||reduce||!prev){ commit(g,true); sync(g); return; }
    // 这两张图本页已经拿到过：直接换，一点遮罩都不挂（本地切世代就是这条路）
    if(loaded[bgUrl(g)]===1 && loaded[logoUrl(g)]===1){ commit(g,false); return; }
    // 真要现下：先挂一个「160ms 后才亮」的遮罩，够快就自动作废
    var endBoot = bootApi ? bootApi.begin(160) : null;
    commit(g,false);
    var closed=false;
    function stop(){
      if(closed) return; closed=true;
      if(endBoot) endBoot();
    }
    waitImages(g, stop);
    setTimeout(stop, 3000);
  }

  var saved='ave';
  try{saved=localStorage.getItem('jubeat-gen')||'ave';}catch(e){}
  var hit=GEN.filter(function(g){return g.k===saved;})[0]||GEN[0];
  apply(hit,true);

  var tswBtn=document.getElementById('tswBtn'), tswPop=document.getElementById('tswPop'), tsw=tswBtn.parentNode;
  /* 焦点管理（2026-10-23 无障碍收口）：
     打开：把焦点送进弹层第一个（或当前选中的）世代按钮——键盘用户不必再 Tab 一次才进得去；
     关闭：把焦点还给 #tswBtn——否则焦点会留在已被 visibility:hidden 摘掉的按钮上，
     读屏与键盘的下一次 Tab 就从「不存在的位置」算起。
     opts.returnFocus=false 用于点击弹层外关闭：那种情况焦点本来就在别处，抢回来反而烦人。 */
  function setOpen(v, opts){
    // 开之前先收起其他浮层（主人 2026-10-26：一个打开，其他就要收起）
    if(v && window.jbPop) window.jbPop.closeOthers('tsw');
    tswPop.setAttribute('data-open',v?'1':'0');
    tswBtn.setAttribute('aria-expanded',v?'true':'false');
    if(v){
      var target = tswPop.querySelector('button[aria-pressed="true"]') || tswPop.querySelector('button');
      if(target) target.focus();
    } else if(!opts || opts.returnFocus!==false){
      // 只有焦点还在弹层里（或已掉到 body）时才还，避免和用户刚点的目标抢焦点
      var act=document.activeElement;
      if(!act || act===document.body || tswPop.contains(act)) tswBtn.focus();
    }
  }
  // 登记到互斥协调器：别的浮层打开时把我们收起来
  if(window.jbPop) window.jbPop.register('tsw',function(){
    if(tswPop.getAttribute('data-open')==='1') setOpen(false,{returnFocus:false});
  },function(){ return tswPop.getAttribute('data-open')==='1'; });

  tswBtn.addEventListener('click',function(ev){
    ev.stopPropagation();
    setOpen(tswPop.getAttribute('data-open')!=='1');
  });
  document.addEventListener('click',function(ev){
    if(tsw.contains(ev.target)) return;
    if(tswPop.getAttribute('data-open')==='1') setOpen(false,{returnFocus:false});
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key!=='Escape') return;
    if(tswPop.getAttribute('data-open')!=='1') return;
    setOpen(false);
  });
})();
