name: build-check

# 校验构建可复现：clean build 后产物与提交内容无关（Astro 产物不入库），只跑构建 + 全部自检。
#
# 【2026-11-04 审计第 18 条】原先只跑 check-refs（还跑了两次，一次源码一次产物），
# 等于六个自检脚本里只有引用检查被自动化——写得不敷衍的 check-song-edits / check-contrast
# 全押在「作者记得住」上。现在整条 npm run check 都跑（含 check-refs 的两次），
# 之后在 README 里也不必再嘱咐「提交前记得跑」。
# 注意：check 与 build 都不能调换顺序——check-refs 的第二次正是要扫 dist。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 【2026-11-04 CI 首跑实撞】data/jubeat.db 是本地库、被 data/.gitignore:13 挡在版本库外，
      # 干净 clone 里没有它，check-search-keys 与 check-schema-doc 会直接 ERR_SQLITE_ERROR。
      # 不把 580 KB 的库塞进仓库（它是生成物），改为在 CI 里按管线重建——
      # 输入全在受版本控制的 data/xlsx/*.json 与 data/upstream/*.json，实测约 3 秒、不需要网络。
      # 只建库不导 seed：这一步要的是「库存在且与快照一致」，不是发布数据。
      - name: 重建本地曲库
        run: node scripts/db/build-db.cjs

      - name: 构建
        run: npm run build

      - name: 全部自检
        run: npm run check
