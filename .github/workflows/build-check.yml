name: build-check

# 校验构建可复现：clean build 后产物与提交内容无关（Astro 产物不入库），只跑构建 + 全部自检。
#
# 【2026-11-04 审计第 18 条】原先只跑 check-refs（还跑了两次，一次源码一次产物），
# 等于六个自检脚本里只有引用检查被自动化——写得不敷衍的 check-song-edits / check-contrast
# 全押在「作者记得住」上。现在整条 npm run check 都跑（含 check-refs 的两次），
# 之后在 README 里也不必再嘱咐「提交前记得跑」。
# 注意：check 与 build 都不能调换顺序——check-refs 的第二次正是要扫 dist。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 【2026-11-18 数据与前端分离】源数据与生成物已移出版本库（仓库是 PUBLIC 的），
      # 改存 R2 私有桶 beyond-jubeat-data，跑 pull 取回。缺凭据时脚本自己跳过并警告，
      # 不让整个 job 变红——但那样构建会因缺 data/ 失败，所以真正跑起来的 CI 必须配这两个 secret。
      # 对象只有几十个、总量 5.5 MB，一次全量拉取，远在 R2 免费额度内。
      - name: 拉取数据
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run data:pull

      # 【2026-11-04 CI 首跑实撞】data/jubeat.db 是本地库、被 data/.gitignore:13 挡在版本库外，
      # 干净 clone 里没有它，check-search-keys 与 check-schema-doc 会直接 ERR_SQLITE_ERROR。
      # 不把 580 KB 的库塞进仓库（它是生成物），改为在 CI 里按管线重建——
      # 输入是上一步拉回的 data/xlsx/*.json 与 data/upstream/*.json，实测约 3 秒、不需要网络。
      # 只建库不导 seed：这一步要的是「库存在且与快照一致」，不是发布数据。
      - name: 重建本地曲库
        run: node scripts/db/build-db.cjs

      - name: 构建
        run: npm run build

      - name: 全部自检
        run: npm run check

      # 【2026-11-17 新增】清 EdgeOne 边缘缓存。
      # 起因：wiki-cn.byd-ub.top 是 EdgeOne 前置，旧 HTML 会被它按源站 max-age 缓存住，
      # 源站已发新版、加速站还在吐旧页（事故见 scripts/ops/purge-edgeone.mjs 的文件头）。
      # 部署由 Cloudflare Workers Builds 在 push 后并行执行，所以脚本会先轮询源站
      # （直连 CF 的 wiki.byd-ub.top）直到页脚出现本次版本号，再发 purge_all。
      # 只在该 workflow 由 push 触发时跑：PR 没有部署，清了也是白清。
      # 密钥用腾讯云子账号，权限只开 EdgeOne 缓存刷新；缺 secret 时步骤失败但整个 job 不红。
      - name: 清 EdgeOne 缓存
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          EDGEONE_ZONE_ID: zone-3we3ellu1uc3
        run: node scripts/ops/purge-edgeone.mjs
