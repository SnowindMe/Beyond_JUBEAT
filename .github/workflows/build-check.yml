name: build-check

# 校验构建可复现：clean build 后产物与提交内容无关（Astro 产物不入库），只跑构建 + 引用完整性
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 构建
        run: npm run build

      - name: 源码引用完整性
        run: node scripts/ci/check-refs.cjs

      - name: 产物引用完整性
        run: node scripts/ci/check-refs.cjs dist
